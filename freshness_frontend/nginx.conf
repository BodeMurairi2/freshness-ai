# Serves the built React app. Caddy in front handles HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # hashed build files (assets/index-3f2a1c.js) never change: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # single page app: unknown paths (/insights, /retrain...) load index.html and React picks the page
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
