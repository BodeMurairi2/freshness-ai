
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: freshness-ai-backend
    restart: unless-stopped
    env_file: .env  # secrets stay on the server, never in the image
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      # kept across restarts and rebuilds
      - uploads:/app/data/uploads
      - models:/app/models
    expose:
      - "8000"
    networks:
      - internal

  frontend:
    build:
      context: ./freshness_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN:-api.freshness.bodemurairi.me}
    image: freshness-ai-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-freshness.bodemurairi.me}
      API_DOMAIN: ${API_DOMAIN:-api.freshness.bodemurairi.me}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  uploads:
  models:
  caddy_data:
  caddy_config:

networks:
  internal:
